name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Une exécution par branche : une poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Java 25 est la cible du projet (pom.xml) ; Node ≥ 22.22 exigé par jsdom.
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    name: Backend (unitaires + intégration Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # verify = tests unitaires (surefire, dont la vérification Spring Modulith) puis tests *IT (failsafe, Kafka et PostgreSQL réels).
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  simulator:
    name: Simulateur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: mvn verify
        working-directory: simulator
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (types, lint, tests, build, E2E démonstration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typage strict
        run: npx tsc -b
      - name: Lint (typescript-eslint strictTypeChecked)
        run: npx eslint .
      - name: Tests unitaires
        run: npx vitest run
      # Production sans tuiles : variables vides = fond neutre, sans ressources externes.
      - name: Build de production
        env:
          VITE_BASEMAP_URL: ""
          VITE_MOTORWAYS_URL: ""
          VITE_GLYPHS_URL: ""
          VITE_SPRITE_URL: ""
        run: npm run build
      - name: Build de démonstration
        run: npm run build:demo
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      # Le serveur de prévisualisation est lancé par playwright.config.ts ; WebGL logiciel (SwiftShader).
      - name: E2E démonstration (rendu réel, erreurs console, accessibilité axe-core)
        run: npx playwright test e2e/demo.spec.ts
      - name: Rapports Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  cartographie:
    name: Référentiel et chaîne cartographique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Tests de la préparation des autoroutes
        working-directory: cartographie
        run: python -m unittest -v test_prepare_motorways
      # Les fichiers de référentiel versionnés doivent correspondre à ce que produisent les scripts : plus de dérive silencieuse.
      # Seules les colonnes d'identifiants sont comparées pour les coordonnées reprojetées (les derniers chiffres dépendent de la version de PROJ).
      - name: Référentiel à jour
        run: |
          cp referentiel/gares-logiques-proposition.csv /tmp/proposition.avant.csv
          python scripts/analyse_referentiel.py
          git diff --exit-code -- referentiel/alias-gares.csv referentiel/gares-logiques-a-arbitrer.csv
          diff <(cut -d';' -f1-8,12 /tmp/proposition.avant.csv) <(cut -d';' -f1-8,12 referentiel/gares-logiques-proposition.csv)

  observabilite:
    name: Supervision (règles Prometheus, tableau de bord Grafana)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configuration et règles Prometheus (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Configuration Alertmanager (amtool)
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Tableau de bord à jour (régénéré puis comparé)
        run: |
          python observability/grafana/build_dashboard.py
          git diff --exit-code -- observability/grafana/dashboards

  shell:
    name: Scripts shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck cartographie/build.sh scripts/perf_history.sh

  docker:
    name: Images Docker et Compose
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compose valide
        run: |
          cp .env.example .env
          for profile in demo infra full monitoring auth tiles; do docker compose --profile "$profile" config -q; done
      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Image simulateur
        uses: docker/build-push-action@v6
        with:
          context: .
          file: simulator/Dockerfile
          push: false
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,scope=simulator,mode=max
      - name: Image frontend (démonstration)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: MODE=demo
          push: false
          cache-from: type=gha,scope=frontend-demo
          cache-to: type=gha,scope=frontend-demo,mode=max

  e2e-live:
    name: E2E chaîne complète (simulateur → Kafka → backend → SSE → navigateur) et supervision
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pile complète (profils full et monitoring, sans tuiles, fond neutre)
        run: |
          GRAFANA_PASSWORD="ci-$(openssl rand -hex 8)"
          echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "COMPOSE_PROFILES=full,monitoring"
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD"
            # Exigés par Compose pour tous les profils (interpolation de tout le fichier), inutilisés sans le profil auth.
            echo "KEYCLOAK_ADMIN_PASSWORD=unused"
            echo "SUPERVISION_CLIENT_SECRET=unused"
            echo "KEYCLOAK_VIEWER_PASSWORD=unused"
            echo "KEYCLOAK_ADMIN_USER_PASSWORD=unused"
            echo "SIMULATOR_RATE=80"
            echo "VITE_BASEMAP_URL="
            echo "VITE_MOTORWAYS_URL="
            echo "VITE_GLYPHS_URL="
            echo "VITE_SPRITE_URL="
          } > .env
          mkdir -p cartographie/out/tiles cartographie/out/basemaps-assets
          docker compose up -d --build
      - name: Attente du backend et du frontend
        run: |
          for i in $(seq 1 90); do
            if [ "$(docker compose ps backend --format '{{.Health}}')" = "healthy" ] \
               && curl -fsS -o /dev/null http://localhost:8080/healthz; then
              echo "prêt après ${i} tentatives"; exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # 4 scénarios : données réelles sans bandeau simulé, latence p95 ≤ 3 s, relecture puis retour au direct, courbe J-7.
      - name: E2E chaîne réelle
        working-directory: frontend
        env:
          E2E_LIVE: "1"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test e2e/live.spec.ts
      # Prometheus : cibles saines, 14 règles chargées ; Grafana : tableau de bord provisionné ; chaque panneau reçoit des données.
      - name: Supervision de bout en bout
        run: python3 scripts/verify_observability.py --timeout 300
      - name: Journaux des services
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose-logs.txt || true
      - name: Artefacts de diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live
          path: |
            compose-logs.txt
            frontend/test-results
          retention-days: 7
      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v

  e2e-auth:
    name: E2E authentification OIDC (navigateur → nginx → backend → Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pile avec connexion obligatoire (profils full et auth)
        run: |
          VIEWER_PASSWORD="ci-$(openssl rand -hex 8)"
          ADMIN_PASSWORD="ci-$(openssl rand -hex 8)"
          echo "E2E_VIEWER_PASSWORD=$VIEWER_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "COMPOSE_PROFILES=full,auth"
            echo "SUPERVISION_PROFILE=auth"
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "GRAFANA_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "KEYCLOAK_ADMIN_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "SUPERVISION_CLIENT_SECRET=ci-$(openssl rand -hex 16)"
            echo "KEYCLOAK_VIEWER_PASSWORD=$VIEWER_PASSWORD"
            echo "KEYCLOAK_ADMIN_USER_PASSWORD=$ADMIN_PASSWORD"
            echo "SIMULATOR_RATE=20"
            echo "VITE_BASEMAP_URL="
            echo "VITE_MOTORWAYS_URL="
            echo "VITE_GLYPHS_URL="
            echo "VITE_SPRITE_URL="
          } > .env
          mkdir -p cartographie/out/tiles cartographie/out/basemaps-assets
          docker compose up -d --build
      - name: Attente de Keycloak, du backend et du frontend
        run: |
          for i in $(seq 1 120); do
            if [ "$(docker compose ps keycloak --format '{{.Health}}')" = "healthy" ] \
               && [ "$(docker compose ps backend --format '{{.Health}}')" = "healthy" ] \
               && curl -fsS -o /dev/null http://localhost:8080/healthz; then
              echo "prêt après ${i} tentatives"; exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # 4 scénarios : 401 sans session puis connexion, lecteur refusé en administration, CSRF de l'administrateur, déconnexion.
      - name: E2E authentification
        working-directory: frontend
        env:
          E2E_AUTH: "1"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test e2e/auth.spec.ts
      - name: Journaux des services
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose-logs.txt || true
      - name: Artefacts de diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth
          path: |
            compose-logs.txt
            frontend/test-results
          retention-days: 7
      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v

  # Point d'entrée unique pour la protection de branche : « CI réussie ».
  ci-ok:
    name: CI réussie
    if: always()
    needs: [backend, simulator, frontend, cartographie, observabilite, shell, docker, e2e-live, e2e-auth]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs sont verts
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          print(json.dumps(bad) if bad else "tous les jobs sont en succès")
          sys.exit(1 if bad else 0)'
