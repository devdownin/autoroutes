name: Image de la chaîne cartographique

# Manuel : compile tippecanoe depuis les sources (long) et télécharge go-pmtiles ; les versions sont figées dans
# cartographie/Dockerfile et à revalider à chaque montée de version. Ne bloque pas la CI courante.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: cartographie
          push: false
          cache-from: type=gha,scope=cartographie
          cache-to: type=gha,scope=cartographie,mode=max
