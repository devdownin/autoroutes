# Profil « auth » : connexion OIDC (Keycloak) obligatoire. Les URL du navigateur et du serveur diffèrent dans Compose
# (localhost:8180 pour l'un, keycloak:8080 pour l'autre) : les points de terminaison sont donc explicites, sans découverte.
supervision:
  security:
    enabled: true
spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:supervision}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          keycloak:
            authorization-uri: ${OIDC_AUTHORIZATION_URI}
            token-uri: ${OIDC_TOKEN_URI}
            jwk-set-uri: ${OIDC_JWK_SET_URI}
            user-name-attribute: preferred_username
