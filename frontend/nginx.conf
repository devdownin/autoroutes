worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    types {
        application/geo+json   geojson;
        application/vnd.pmtiles pmtiles;
    }
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types application/javascript text/css application/json application/geo+json image/svg+xml;

    # Résolution DNS à la requête : nginx démarre même si le backend n'est pas encore lancé.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Seul niveau où add_header est utilisé : un add_header dans une location annulerait ces en-têtes (héritage nginx).
        # Les durées de cache passent donc par « expires ».
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'" always;

        location = /healthz { access_log off; return 204; }

        location = /index.html { expires -1; }

        location /assets/ { expires 1y; }

        # PMTiles : lecture par requêtes HTTP Range ; pas de gzip (incompatible avec les plages d'octets).
        location /tiles/ {
            gzip off;
            expires 1d;
        }

        location /basemaps-assets/ { expires 7d; }

        location /api/v1/stream {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE : aucun tampon, connexion longue.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # Connexion OIDC (Spring Security) : l'adresse publique (hôte, port, protocole) est transmise pour construire l'URL de retour.
        location ~ ^/(oauth2|login|logout)(/|$) {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /api/ {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            expires -1;
            try_files $uri /index.html;
        }
    }
}
